services:
  builder:
    image: unbound-builder:debian13-slim
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      # All compilation happens in Docker's volume.
      # This avoids userns-remap permission problems.
      - unbound-work:/workspace

      # Only the final artifacts are exposed to the host.
      - ./output:/output

      # Build script is supplied from the host.
      - ./build.sh:/build.sh:ro

    working_dir: /workspace

    entrypoint:
      - /bin/bash
      - /build.sh

volumes:
  unbound-work:
